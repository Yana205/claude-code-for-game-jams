<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#0b0d17"/>
  <!-- pixel gamepad body -->
  <g fill="#d97757">
    <rect x="12" y="20" width="40" height="20"/>
    <rect x="8" y="24" width="4" height="14"/>
    <rect x="52" y="24" width="4" height="14"/>
    <rect x="8" y="38" width="10" height="6"/>
    <rect x="46" y="38" width="10" height="6"/>
  </g>
  <!-- d-pad -->
  <g fill="#0b0d17">
    <rect x="18" y="24" width="5" height="13"/>
    <rect x="14" y="28" width="13" height="5"/>
  </g>
  <!-- buttons -->
  <rect x="41" y="23" width="6" height="6" fill="#7ee787"/>
  <rect x="47" y="30" width="6" height="6" fill="#ffd66e"/>
  <rect x="35" y="30" width="6" height="6" fill="#ff7bc1"/>
  <!-- sparkle -->
  <rect x="50" y="10" width="4" height="4" fill="#7ee787"/>
  <rect x="10" y="50" width="4" height="4" fill="#79c0ff"/>
</svg>
